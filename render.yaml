services:
  - type: web
    name: infinity-travels
    runtime: python
    plan: starter            # free plan has no persistent disk; bookings would be lost on restart
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/bookings.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
